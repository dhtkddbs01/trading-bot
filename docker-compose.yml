# 로컬 개발용 — Kafka(상시) + Spark(배치 때만). 6단계 서버 compose 의 초안
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka                         # 기존 명령(docker exec kafka ...)을 그대로 쓰려고
    restart: unless-stopped                       # Docker Desktop 이 켜지면 같이 뜸
    ports:
      - "127.0.0.1:9092:9092"                     # 이 PC 안에서만 접속 (Kafka 는 인증이 없어서 밖으로 열지 않음)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller      # KRaft — 한 대가 브로커 겸 컨트롤러
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 주소 2개: 컨테이너끼리(Spark · 서버 수신기)는 kafka:19092, 이 PC 에서 직접(데스크탑 수신기)은 127.0.0.1:9092
      # (localhost 는 IPv6 로 먼저 풀려 접속 실패 로그가 남아서 IPv4 주소를 그대로 씀)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 브로커가 1대라 내부 관리 토픽도 복제 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"    # 없는 토픽으로 보내면 조용히 새로 만들지 않고 에러
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data            # 컨테이너를 지워도 메시지가 남게
    healthcheck:                                  # 브로커가 요청을 받을 수 있는지 10초마다 확인
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  receiver:                                       # 토스 WebSocket → Kafka 수신기 (서버에서 cron 이 장 시간에만 켜고 끔)
    build: .
    image: trading-bot-receiver
    profiles: ["collect"]                         # up 으로는 안 뜸 — docker compose up -d receiver 로만
    command: ["python", "-u", "-m", "src.exchange.web_socket", "005930", "000660"]
    user: "1000:1000"                             # 토큰 캐시 · fallback 파일이 root 소유로 생기지 않게 (서버 사용자 uid)
    env_file: .env                                # 토스 키
    environment:
      KAFKA_BOOTSTRAP: kafka:19092                # 컨테이너끼리 쓰는 주소
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure                           # 예상 못 한 에러로 죽으면 다시 띄움 (cron 의 stop 은 정상 종료라 안 띄움)
    stop_grace_period: 20s                        # 종료 신호 뒤 flush · 연결 정리할 시간
    volumes:
      - ./.cache:/app/.cache                      # 토큰 캐시 — 재시작해도 토큰 재사용
      - ./data:/app/data                          # Kafka 로 못 보낸 원본 (data/fallback/)
    logging:                                      # 체결마다 한 줄씩 찍혀서 로그 크기 제한
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  spark:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    profiles: ["batch"]                           # up 으로는 안 뜸 — docker compose run 으로 배치 때만
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /opt/spark/work-dir
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs           # Spark 작업 코드 (bronze.py 등)
      - ./data:/opt/spark/work-dir/data           # 결과 Parquet — Windows 에서도 보임 (.gitignore)
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./.cache/spark-ivy:/opt/spark/work-dir/.ivy2   # Kafka 연결 jar 캐시 (매번 다시 받지 않게)

volumes:
  kafka-data:
