# Spark 컨테이너의 기본 설정 — 모든 작업(bronze · silver · gold)에 똑같이 적용된다
# Kafka 를 읽는 연결 모듈 (Spark 버전과 같은 4.1.3)
spark.jars.packages          org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
# 받은 jar 를 둘 곳 — compose 에서 ./.cache/spark-ivy 와 연결
spark.jars.ivy               /opt/spark/work-dir/.ivy2
# 날짜 계산을 한국 시간으로 (date 파티션이 KST 기준이 되게)
spark.sql.session.timeZone   Asia/Seoul
